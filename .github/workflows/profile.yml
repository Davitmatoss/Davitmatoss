name: Atualizar perfil

'on':
  push:
    branches: [main, master]
    paths:
      - README.md
      - .github/workflows/profile.yml
      - scripts/update_stats.py
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: Davitmatoss
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github-dark&color_snake=#FF7185&color_dots=#161f30,#234471,#3568a7,#528bff,#9bbaff
            assets/github-snake.gif?color_snake=#FF7185&color_dots=#161f30,#234471,#3568a7,#528bff,#9bbaff&color_background=#0d1117

      - name: Atualizar imagens locais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_stats.py

      - name: Publicar arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake.gif assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "Atualiza gráficos do perfil" && git push)
